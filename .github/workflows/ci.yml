name: CI - Autonomous Sanity & Test Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-health:
    name: Gate G0 - Harness Health & Rules Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Harness Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Harness Health Verification (check_harness.py)
        run: python scripts/check_harness.py

      - name: Run Harness Unit Tests
        run: pytest tests/harness

  contracts-test:
    name: Gate G1 - Smart Contracts Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/contracts/package.json

      - name: Install Contracts Dependencies
        run: |
          cd packages/contracts
          npm ci

      - name: Compile and Test Hardhat Contracts
        run: |
          cd packages/contracts
          npx hardhat test

  web-test:
    name: Gate G1 - Web Application Integration Suite
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'test-api-key' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "expendry.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "expendry"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:583715970502:web:0fd814e71c503f4e68e6c7"
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY || 'test-sarvam-key' }}
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Run Web Test Suite
        run: bun test --cwd packages/web

  web-build:
    name: Gate G4 - Next.js Production Build
    needs: [harness-health, web-test]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyDPl7SFvU0RrOCQ1aM1y_TOVRcGoYSTPnk' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "expendry.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "expendry"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:583715970502:web:0fd814e71c503f4e68e6c7"
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY || 'test-sarvam-key' }}
      NODE_ENV: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Next.js 16 Production Application
        run: bun run build --filter=web
